{% extends 'base.html' %}

{% block title %}{% endblock %}

{% block content %}

<div class="card shadow-sm border-0">

    <div class="card-header">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">

            <h5 class="mb-0">
                <i class="bi bi-person-plus text-primary me-2"></i>
                Tambah Operator
            </h5>

            <a
                href="/data-operator/"
                class="btn btn-secondary btn-sm ms-auto"
            >
                <i class="bi bi-arrow-left me-1"></i>
                Kembali
            </a>

        </div>
    </div>

    <div class="card-body">

        <form method="POST">
            {% csrf_token %}

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Nama Lengkap</label>
                    <input
                        type="text"
                        name="nama_lengkap"
                        class="form-control"
                        placeholder="Masukkan nama lengkap"
                        required
                    >
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Username</label>
                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Masukkan username"
                        required
                    >
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <input
                        type="text"
                        name="password"
                        class="form-control"
                        placeholder="Masukkan password"
                        required
                    >
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Kecamatan</label>
                    <select id="id_kecamatan" class="form-select" required>
                        <option value="">Pilih Kecamatan</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Desa</label>
                    <select id="id_desa" class="form-select" required>
                        <option value="">Pilih Desa</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Sekolah</label>
                    <select id="id_sekolah" name="sekolah" class="form-select" required>
                        <option value="">Pilih Sekolah</option>
                    </select>
                </div>

            </div>

            <div class="d-flex justify-content-end gap-2 mt-3">

                <a href="/data-operator/" class="btn btn-secondary">
                    Batal
                </a>

                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save me-2"></i>
                    Simpan Operator
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}

{% block js %}

<script>
    const dataWilayah = {{ data_wilayah|safe }};
    const dataSekolah = {{ data_sekolah|safe }};

    const kecamatanSelect = document.getElementById('id_kecamatan');
    const desaSelect = document.getElementById('id_desa');
    const sekolahSelect = document.getElementById('id_sekolah');

    Object.keys(dataWilayah).forEach(function (kecamatan) {
        const option = document.createElement('option');
        option.value = kecamatan;
        option.textContent = kecamatan;
        kecamatanSelect.appendChild(option);
    });

    kecamatanSelect.addEventListener('change', function () {
        const kecamatan = this.value;
        const desaList = dataWilayah[kecamatan] || [];

        desaSelect.innerHTML = '<option value="">Pilih Desa</option>';
        sekolahSelect.innerHTML = '<option value="">Pilih Sekolah</option>';

        desaList.forEach(function (desa) {
            const option = document.createElement('option');
            option.value = desa;
            option.textContent = desa;
            desaSelect.appendChild(option);
        });
    });

    desaSelect.addEventListener('change', function () {
        const kecamatan = kecamatanSelect.value;
        const desa = this.value;

        sekolahSelect.innerHTML = '<option value="">Pilih Sekolah</option>';

        const sekolahFilter = dataSekolah.filter(function (sekolah) {
            return sekolah.kecamatan === kecamatan && sekolah.desa === desa;
        });

        sekolahFilter.forEach(function (sekolah) {
            const option = document.createElement('option');
            option.value = sekolah.id;
            option.textContent = sekolah.nama + ' - NPSN ' + sekolah.npsn;
            sekolahSelect.appendChild(option);
        });

        if (sekolahFilter.length === 0 && desa !== '') {
            const option = document.createElement('option');
            option.value = '';
            option.textContent = 'Tidak ada sekolah tersedia';
            sekolahSelect.appendChild(option);
        }
    });
</script>

{% endblock %}
