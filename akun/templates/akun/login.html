<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login SIPETAKU</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    {% load static %}

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(
                135deg,
                #020617 0%,
                #0f172a 30%,
                #1d4ed8 70%,
                #4f46e5 100%
            );
        }

        .login-subtitle {
            white-space: nowrap;
            font-size: 0.95rem;
        }

        .login-wrapper {

            min-height: 100vh;

            padding: 20px 16px;

            display: flex;

            align-items: center;

            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            border: none;
            border-radius: 24px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
        }

        .login-logo {
            width: 110px;
            height: 110px;
            object-fit: contain;
        }

        .btn-login {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            border: none;
            height: 44px;
            font-weight: 600;
        }

        .btn-login:hover {
            opacity: 0.95;
        }

        @media (max-width: 576px) {
            .login-subtitle {
                font-size: 0.85rem;
            }
        }

        @media (max-width: 576px) {

            .login-wrapper {

                padding: 24px 16px;

                align-items: center;
            }

            .login-card {

                width: 100%;

                max-width: 100%;

                border-radius: 22px;
            }

            .login-card .card-body {

                padding: 26px 20px !important;
            }

            .login-logo {

                width: 90px;
                height: 90px;
            }

            h3 {

                font-size: 1.6rem;
            }

            .form-control,
            .input-group-text {

                min-height: 46px;
            }

            .btn-login {

                height: 48px;

                font-size: 1rem;
            }
        }
    </style>
</head>

<body>

<div class="login-wrapper">
    <div class="login-card card shadow-lg">

        <div class="card login-card shadow-lg">
            <div class="card-body p-4">

                <div class="text-center mb-3">
                    <img
                        src="{% static 'img/logo.png' %}"
                        alt="Logo SIPETAKU"
                        class="login-logo"
                    >
                </div>

                <h3 class="text-center mb-1 fw-bold">
                    SIPETAKU
                </h3>

                <p class="text-center text-muted mb-4 login-subtitle">
                    Sistem Informasi Pemetaan Sekolah Kutai Timur
                </p>

                {% if messages %}

                    {% for message in messages %}

                        <div class="alert alert-danger alert-dismissible fade show" role="alert">

                            <i class="bi bi-exclamation-triangle-fill me-2"></i>

                            {{ message }}

                            <button
                                type="button"
                                class="btn-close"
                                data-bs-dismiss="alert"
                            ></button>

                        </div>

                    {% endfor %}

                {% endif %}

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Username</label>

                        <div class="input-group">
                            <span class="input-group-text bg-white">
                                <i class="bi bi-person text-primary"></i>
                            </span>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                placeholder="Masukkan username"
                                required
                            >
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>

                        <div class="input-group">
                            <span class="input-group-text bg-white">
                                <i class="bi bi-lock text-primary"></i>
                            </span>

                            <input
                                type="password"
                                name="password"
                                id="passwordInput"
                                class="form-control"
                                placeholder="Masukkan password"
                                required
                            >

                            <button
                                type="button"
                                class="input-group-text bg-white"
                                id="togglePassword"
                                style="cursor:pointer;"
                            >
                                <i class="bi bi-eye text-primary"></i>
                            </button>
                        </div>
                    </div>

                    <button
                        type="submit"
                        class="btn btn-login text-white w-100"
                    >
                        <i class="bi bi-box-arrow-in-right"></i>
                        Login
                    </button>
                </form>

                <hr>

                <p class="text-center text-muted small mb-0">
                    Dinas Pendidikan Kabupaten Kutai Timur
                </p>

            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const form = document.querySelector('form');

        form.addEventListener('submit', function () {
            const tombol = form.querySelector('button[type="submit"]');

            tombol.disabled = true;
            tombol.innerHTML = `
                <span class="spinner-border spinner-border-sm me-2"></span>
                Memproses...
            `;
        });
    });

    const tombolPassword = document.getElementById('togglePassword');
    const inputPassword = document.getElementById('passwordInput');

    tombolPassword.addEventListener('click', function () {
        const tipe =
            inputPassword.getAttribute('type') === 'password'
            ? 'text'
            : 'password';

        inputPassword.setAttribute('type', tipe);

        this.innerHTML =
            tipe === 'password'
            ? '<i class="bi bi-eye text-primary"></i>'
            : '<i class="bi bi-eye-slash text-primary"></i>';
    });
</script>

</body>
</html>
