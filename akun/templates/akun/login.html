<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login SIPETAKU</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #198754, #0d6efd);
        }

        .login-card {
            border: none;
            border-radius: 18px;
        }

        .logo-circle {
            width: 70px;
            height: 70px;
            background: #198754;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px auto;
            font-size: 34px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="row justify-content-center align-items-center min-vh-100">

        <div class="col-md-4">

            <div class="card login-card shadow-lg">

                <div class="card-body p-4">

                    <div class="logo-circle">
                        <i class="bi bi-geo-alt-fill"></i>
                    </div>

                    <h3 class="text-center mb-1">
                        SIPETAKU
                    </h3>

                    <p class="text-center text-muted mb-4">
                        Sistem Informasi Pemetaan Sekolah Kutai Timur
                    </p>

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">
                                Username
                            </label>

                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-person"></i>
                                </span>

                                <input
                                    type="text"
                                    name="username"
                                    class="form-control"
                                    placeholder="Masukkan username"
                                    required
                                >
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Password
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-lock"></i>
                                </span>

                                <input
                                    type="password"
                                    name="password"
                                    id="passwordInput"
                                    class="form-control"
                                    placeholder="Masukkan password"
                                    required
                                >

                                <button
                                    type="button"
                                    class="input-group-text bg-white"
                                    id="togglePassword"
                                    style="cursor:pointer;"
                                >
                                    <i class="bi bi-eye"></i>
                                </button>

                            </div>
                        </div>

                        <button
                            type="submit"
                            class="btn btn-success w-100"
                        >
                            <i class="bi bi-box-arrow-in-right"></i>
                            Login
                        </button>

                    </form>

                    <hr>

                    <p class="text-center text-muted small mb-0">
                        Dinas Pendidikan Kabupaten Kutai Timur
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const form = document.querySelector('form');

        form.addEventListener('submit', function () {
            const tombol = form.querySelector('button[type="submit"]');

            tombol.disabled = true;
            tombol.innerHTML = `
                <span class="spinner-border spinner-border-sm me-2"></span>
                Memproses...
            `;
        });
    });
    const tombolPassword = document.getElementById('togglePassword');
    const inputPassword = document.getElementById('passwordInput');

    tombolPassword.addEventListener('click', function () {

        const tipe =
            inputPassword.getAttribute('type') === 'password'
            ? 'text'
            : 'password';

        inputPassword.setAttribute('type', tipe);

        this.innerHTML =
            tipe === 'password'
            ? '<i class="bi bi-eye"></i>'
            : '<i class="bi bi-eye-slash"></i>';

    });
</script>

</body>
</html>
