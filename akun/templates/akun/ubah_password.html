{% extends 'base.html' %}

{% block title %}{% endblock %}


{% block content %}

<div class="container-fluid">

    <div class="row justify-content-center">

        <div class="col-xl-6 col-lg-7 col-md-9">


            <!-- =====================================================
                 HEADER
            ====================================================== -->

            <div class="card shadow-sm border-0 mb-4">

                <div class="card-header bg-body border-0">

                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">

                        <div>

                            <h5 class="mb-1">

                                <i class="bi bi-shield-lock text-primary me-2"></i>

                                Ubah Password

                            </h5>


                            <small class="text-muted">

                                Kelola keamanan akun SIPANDU Anda

                            </small>

                        </div>


                        <span class="badge bg-primary px-3 py-2">

                            <i class="bi bi-person-circle me-1"></i>

                            {{ user_login.username }}

                        </span>

                    </div>

                </div>

            </div>


            <!-- =====================================================
                 FORM
            ====================================================== -->

            <form
                method="POST"
                id="formUbahPassword"
            >

                {% csrf_token %}


                <div class="card shadow-sm border-0">

                    <div class="card-body">


                        <!-- =================================================
                             PASSWORD LAMA
                        ================================================== -->

                        <div class="mb-3">

                            <label
                                for="passwordLama"
                                class="form-label fw-semibold"
                            >

                                Password Lama

                                <span class="text-danger">
                                    *
                                </span>

                            </label>


                            <div class="input-group">

                                <input
                                    type="password"
                                    name="password_lama"
                                    id="passwordLama"
                                    class="form-control"
                                    required
                                    autocomplete="current-password"
                                    placeholder="Masukkan password lama"
                                >


                                <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    onclick="
                                        togglePassword(
                                            'passwordLama',
                                            this
                                        )
                                    "
                                    title="Tampilkan Password"
                                >

                                    <i class="bi bi-eye"></i>

                                </button>

                            </div>

                        </div>



                        <!-- =================================================
                             PASSWORD BARU
                        ================================================== -->

                        <div class="mb-3">

                            <label
                                for="passwordBaru"
                                class="form-label fw-semibold"
                            >

                                Password Baru

                                <span class="text-danger">
                                    *
                                </span>

                            </label>


                            <div class="input-group">

                                <input
                                    type="password"
                                    name="password_baru"
                                    id="passwordBaru"
                                    class="form-control"
                                    required
                                    autocomplete="new-password"
                                    placeholder="Masukkan password baru"
                                >


                                <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    onclick="
                                        togglePassword(
                                            'passwordBaru',
                                            this
                                        )
                                    "
                                    title="Tampilkan Password"
                                >

                                    <i class="bi bi-eye"></i>

                                </button>

                            </div>


                            <div class="form-text">

                                Gunakan kombinasi huruf, angka,
                                dan karakter khusus apabila diperlukan.

                            </div>

                        </div>



                        <!-- =================================================
                             KONFIRMASI PASSWORD
                        ================================================== -->

                        <div class="mb-0">

                            <label
                                for="konfirmasiPassword"
                                class="form-label fw-semibold"
                            >

                                Konfirmasi Password Baru

                                <span class="text-danger">
                                    *
                                </span>

                            </label>


                            <div class="input-group">

                                <input
                                    type="password"
                                    name="konfirmasi_password"
                                    id="konfirmasiPassword"
                                    class="form-control"
                                    required
                                    autocomplete="new-password"
                                    placeholder="Ulangi password baru"
                                >


                                <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    onclick="
                                        togglePassword(
                                            'konfirmasiPassword',
                                            this
                                        )
                                    "
                                    title="Tampilkan Password"
                                >

                                    <i class="bi bi-eye"></i>

                                </button>

                            </div>

                        </div>


                    </div>

                </div>



                <!-- =====================================================
                     AKSI
                ====================================================== -->

                <div class="card border-0 shadow-sm mt-4">

                    <div class="card-body">

                        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">


                            <small class="text-muted">

                                <span class="text-danger">
                                    *
                                </span>

                                Wajib diisi

                            </small>


                            <button
                                type="submit"
                                class="btn btn-primary"
                                id="btnSimpanPassword"
                            >

                                <i
                                    class="bi bi-shield-check me-1"
                                    id="iconSimpanPassword"
                                ></i>


                                <span id="textSimpanPassword">

                                    Simpan Perubahan

                                </span>

                            </button>


                        </div>

                    </div>

                </div>


            </form>


        </div>

    </div>

</div>

{% endblock %}



{% block js %}

<script>

document.addEventListener(
    'DOMContentLoaded',
    function () {


        // =====================================================
        // ELEMENT
        // =====================================================

        const form =
            document.getElementById(
                'formUbahPassword'
            );


        const button =
            document.getElementById(
                'btnSimpanPassword'
            );


        const icon =
            document.getElementById(
                'iconSimpanPassword'
            );


        const text =
            document.getElementById(
                'textSimpanPassword'
            );



        // =====================================================
        // LOADING
        // =====================================================

        if (form) {

            form.addEventListener(
                'submit',
                function () {

                    if (
                        button
                        &&
                        icon
                        &&
                        text
                    ) {

                        button.disabled =
                            true;


                        icon.className =
                            'spinner-border '
                            + 'spinner-border-sm me-2';


                        text.textContent =
                            'Menyimpan...';

                    }

                }
            );

        }


    }
);



/* =========================================================
   TOGGLE PASSWORD
========================================================= */

function togglePassword(
    inputId,
    button
) {

    const input =
        document.getElementById(
            inputId
        );


    const icon =
        button.querySelector(
            'i'
        );


    if (
        input.type === 'password'
    ) {

        input.type =
            'text';


        icon.classList.remove(
            'bi-eye'
        );


        icon.classList.add(
            'bi-eye-slash'
        );


        button.title =
            'Sembunyikan Password';


    } else {

        input.type =
            'password';


        icon.classList.remove(
            'bi-eye-slash'
        );


        icon.classList.add(
            'bi-eye'
        );


        button.title =
            'Tampilkan Password';

    }

}

</script>

{% endblock %}
