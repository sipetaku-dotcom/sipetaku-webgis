{% extends 'base.html' %}

{% block title %}{% endblock %}

{% block content %}

<div class="card shadow-sm border-0">

    <div class="card-header">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">

            <h5 class="mb-0">
                <i class="bi bi-person-gear text-primary me-2"></i>
                Tambah Admin Kecamatan
            </h5>

            <a
                href="/data-admin-kecamatan/"
                class="btn btn-secondary btn-sm ms-auto"
            >
                <i class="bi bi-arrow-left me-1"></i>
                Kembali
            </a>

        </div>
    </div>

    <div class="card-body">

        <form method="POST">
            {% csrf_token %}

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Nama Lengkap</label>
                    <input
                        type="text"
                        name="nama_lengkap"
                        class="form-control"
                        placeholder="Masukkan nama lengkap"
                        required
                    >
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Username</label>
                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Masukkan username"
                        required
                    >
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <input
                        type="text"
                        name="password"
                        class="form-control"
                        placeholder="Masukkan password"
                        required
                    >
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Kecamatan</label>

                    <select
                        name="kecamatan"
                        class="form-select"
                        required
                    >
                        <option value="">Pilih Kecamatan</option>

                        {% for kecamatan, desa in data_wilayah.items %}
                            <option value="{{ kecamatan }}">
                                {{ kecamatan }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

            </div>

            <div class="d-flex justify-content-end gap-2 mt-3">

                <a href="/data-admin-kecamatan/" class="btn btn-secondary">
                    Batal
                </a>

                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save me-2"></i>
                    Simpan Admin Kecamatan
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
